name: Build Zeeshan Ephemeral Audio Diary APK with Secure C++ Engine

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Complete Zeeshan Audio Diary APK (Kotlin + C++ Engine)
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4

      - name: 2. Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: 4. Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: 5. Create Directory Structure Automatically
        run: |
          set -euo pipefail
          echo "📂 Creating required Android & C++ project structure..."
          mkdir -p app/src/main/java/com/zeeshan/audiodiary
          mkdir -p app/src/main/cpp
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p .github/workflows

      - name: 6. Write gradle.properties
        run: |
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.daemon=false
          EOF

      - name: 7. Write settings.gradle
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "ZeeshanAudioDiary"
          include(":app")
          EOF

      - name: 8. Write Root build.gradle
        run: |
          cat > build.gradle <<'EOF'
          plugins {
              id "com.android.application" version "8.2.2" apply false
              id "org.jetbrains.kotlin.android" version "1.9.22" apply false
          }
          EOF

      - name: 9. Write App-level build.gradle with Native C++ & CMake Config
        run: |
          cat > app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
              id "org.jetbrains.kotlin.android"
          }
          android {
              namespace "com.zeeshan.audiodiary"
              compileSdk 34
              defaultConfig {
                  applicationId "com.zeeshan.audiodiary"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
                  externalNativeBuild {
                      cmake {
                          cppFlags "-std=c++17 -O2"
                          arguments "-DSD_ENABLE_JNI=ON"
                      }
                  }
              }
              buildTypes { 
                  release { minifyEnabled false }
                  debug { minifyEnabled false }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose true }
              composeOptions { kotlinCompilerExtensionVersion "1.5.8" }
              externalNativeBuild {
                  cmake {
                      path file("src/main/cpp/CMakeLists.txt")
                      version "3.22.1"
                  }
              }
          }
          dependencies {
              implementation "androidx.core:core-ktx:1.13.1"
              implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.4"
              implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.8.4"
              implementation "androidx.activity:activity-compose:1.9.1"
              implementation platform("androidx.compose:compose-bom:2024.08.00")
              implementation "androidx.compose.ui:ui"
              implementation "androidx.compose.ui:ui-graphics"
              implementation "androidx.compose.material3:material3"
              implementation "androidx.compose.material:material-icons-extended"
              implementation "com.google.mlkit:language-id:17.0.5"
          }
          EOF

      - name: 10. Write AndroidManifest.xml
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <queries>
                  <intent>
                      <action android:name="android.intent.action.TTS_SERVICE" />
                  </intent>
              </queries>
              <application
                  android:allowBackup="false"
                  android:icon="@drawable/ic_app_icon"
                  android:roundIcon="@drawable/ic_app_icon"
                  android:label="Zeeshan, Audio"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: 11. Write Strings Resource XML
        run: |
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Zeeshan, Audio</string>
          </resources>
          EOF

      - name: 12. Write App Icon Vector Drawable
        run: |
          cat > app/src/main/res/drawable/ic_app_icon.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#0D47A1"
                  android:pathData="M12,2C6.48,2 2,6.48 2,12s4.48,10 10,10 10,-4.48 10,-10S17.52,2 12,2z"/>
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M8,11h8v2H8V11z M8,7h8v2H8V7z M8,15h5v2H8V15z"/>
          </vector>
          EOF

      - name: 13. Write NativeVault.kt (Kotlin JNI Bridge)
        run: |
          cat > app/src/main/java/com/zeeshan/audiodiary/NativeVault.kt <<'EOF'
          package com.zeeshan.audiodiary

          object NativeVault {
              init {
                  System.loadLibrary("sd")
              }

              external fun nativeOpenFile(dir: String, key: ByteArray, capacity: Long): Long
              external fun nativeWrite(handle: Long, offset: Long, data: ByteArray): Int
              external fun nativeRead(handle: Long, offset: Long, len: Long): ByteArray?
              external fun nativeDestroy(handle: Long): Int
              external fun nativeClose(handle: Long)
          }
          EOF

      - name: 14. Write C++ Engine (`sd_engine.cpp`)
        run: |
          cat > app/src/main/cpp/sd_engine.cpp <<'EOF'
          // sd_engine.cpp
          // सार्वभौमिक सुरक्षित स्टोरेज इंजन: एक फ़ाइल, कोई बाहरी लाइब्रेरी नहीं।
          #if defined(_WIN32)
          #  ifndef _CRT_SECURE_NO_WARNINGS
          #    define _CRT_SECURE_NO_WARNINGS
          #  endif
          #  ifndef _CRT_RAND_S
          #    define _CRT_RAND_S
          #  endif
          #endif

          #include <algorithm>
          #include <array>
          #include <atomic>
          #include <cerrno>
          #include <cstdint>
          #include <cstdio>
          #include <cstdlib>
          #include <cstring>
          #include <functional>
          #include <list>
          #include <memory>
          #include <mutex>
          #include <new>
          #include <random>
          #include <shared_mutex>
          #include <string>
          #include <string_view>
          #include <unordered_map>
          #include <unordered_set>
          #include <utility>
          #include <vector>

          #if defined(_WIN32)
          #  define SD_WINDOWS 1
          #  ifndef NOMINMAX
          #    define NOMINMAX
          #  endif
          #  include <windows.h>
          #  include <stdlib.h>
          #elif defined(__EMSCRIPTEN__)
          #  define SD_WEB 1
          #else
          #  define SD_POSIX 1
          #  include <fcntl.h>
          #  include <sys/stat.h>
          #  include <sys/statvfs.h>
          #  include <unistd.h>
          #  if defined(__APPLE__) && defined(__has_include)
          #    if __has_include(<os/proc.h>)
          #      include <os/proc.h>
          #      define SD_HAS_OS_PROC 1
          #    endif
          #  endif
          #endif

          #if defined(_WIN32) && defined(SD_BUILD_DLL)
          #  define SD_API extern "C" __declspec(dllexport)
          #elif defined(_WIN32)
          #  define SD_API extern "C" __declspec(dllimport)
          #elif defined(__GNUC__)
          #  define SD_API extern "C" __attribute__((visibility("default")))
          #else
          #  define SD_API extern "C"
          #endif

          namespace sd {

          constexpr uint64_t KiB = 1024ull;
          constexpr uint64_t MiB = 1024ull * KiB;
          constexpr uint64_t GiB = 1024ull * MiB;
          constexpr uint64_t TiB = 1024ull * GiB;

          constexpr uint64_t kMinCapacity        = 10 * MiB;
          constexpr uint64_t kMaxCapacity        = 1 * TiB;
          constexpr uint64_t kMinCache           = 4 * MiB;
          constexpr uint64_t kMaxCache           = 512 * MiB;
          constexpr uint64_t kDefaultCache       = 16 * MiB;
          constexpr uint32_t kMinChunk           = 64 * 1024;
          constexpr uint32_t kMaxChunk           = 16 * 1024 * 1024;
          constexpr uint32_t kDefaultChunk       = 1 * 1024 * 1024;
          constexpr uint64_t kMaxIoPerCall       = 32 * MiB;
          constexpr uint64_t kMaxPathLen         = 4096;
          constexpr uint64_t kHeaderBytes        = 4096;
          constexpr uint64_t kMinFreeAfterGrowth = 1 * MiB;
          constexpr uint64_t kMaxRamCacheFrac    = 8;
          constexpr uint64_t kFallbackRamBytes   = 32 * MiB;

          constexpr size_t   kKey        = 32;
          constexpr size_t   kNonce      = 24;
          constexpr size_t   kTag        = 16;
          constexpr size_t   kHdrPlain   = 32;
          constexpr size_t   kHdrRec     = kNonce + kHdrPlain + kTag;
          constexpr size_t   kAadLen     = 16;
          constexpr uint32_t kMagic      = 0x53444532u;
          constexpr uint32_t kVersion    = 2;
          constexpr uint32_t kKindHeader = 1;
          constexpr uint32_t kKindChunk  = 2;
          constexpr size_t   kCacheShards = 8;

          static_assert(sizeof(size_t) >= 8, "64-bit address space required");

          enum class Err : int {
              Ok = 0, NotOpen, BadConfig, BadKey, BadArg, OutOfRange,
              TooLarge, NoSpace, NoRam, Io, Crypto, Format
          };

          struct Config {
              uint64_t capacityBytes = 0;
              uint64_t cacheBytes    = kDefaultCache;
              uint32_t chunkBytes    = kDefaultChunk;
          };

          struct MutableBytes {
              uint8_t* data = nullptr;
              uint64_t size = 0;
          };

          inline void secureWipe(void* p, size_t n) noexcept {
              if (!p || n == 0) return;
          #if defined(SD_WINDOWS)
              SecureZeroMemory(p, n);
          #else
              volatile unsigned char* v = static_cast<volatile unsigned char*>(p);
              while (n--) *v++ = 0;
          #  if defined(__GNUC__) || defined(__clang__)
              __asm__ __volatile__("" : : "r"(p) : "memory");
          #  else
              std::atomic_signal_fence(std::memory_order_seq_cst);
          #  endif
          #endif
          }

          inline bool constTimeEqual(const uint8_t* a, const uint8_t* b, size_t n) noexcept {
              uint8_t d = 0;
              for (size_t i = 0; i < n; ++i) d |= static_cast<uint8_t>(a[i] ^ b[i]);
              return d == 0;
          }

          using RandomFn = int (*)(uint8_t* buf, size_t n);
          inline std::atomic<RandomFn>& randomSource() noexcept {
              static std::atomic<RandomFn> fn{nullptr};
              return fn;
          }

          inline bool fillRandom(uint8_t* p, size_t n) noexcept {
              if (RandomFn f = randomSource().load(std::memory_order_acquire)) return f(p, n) == 0;
          #if defined(SD_WINDOWS)
              size_t i = 0;
              while (i < n) {
                  unsigned int v = 0;
                  if (rand_s(&v) != 0) return false;
                  for (int k = 0; k < 4 && i < n; ++k, ++i) p[i] = uint8_t(v >> (8 * k));
              }
              return true;
          #elif defined(SD_WEB)
              try {
                  std::random_device rd;
                  size_t i = 0;
                  while (i < n) {
                      const unsigned int v = rd();
                      for (int k = 0; k < 4 && i < n; ++k, ++i) p[i] = uint8_t(v >> (8 * k));
                  }
                  return true;
              } catch (...) { return false; }
          #else
              const int fd = ::open("/dev/urandom", O_RDONLY | O_CLOEXEC);
              if (fd < 0) return false;
              size_t done = 0;
              bool ok = true;
              while (done < n) {
                  const ssize_t r = ::read(fd, p + done, n - done);
                  if (r < 0 && errno == EINTR) continue;
                  if (r <= 0) { ok = false; break; }
                  done += size_t(r);
              }
              ::close(fd);
              return ok;
          #endif
          }

          inline uint64_t availableRamBytes() noexcept {
          #if defined(SD_HAS_OS_PROC)
              return uint64_t(os_proc_available_memory());
          #elif defined(SD_WINDOWS)
              MEMORYSTATUSEX ms{};
              ms.dwLength = sizeof ms;
              return GlobalMemoryStatusEx(&ms) ? uint64_t(ms.ullAvailPhys) : 0;
          #elif defined(__linux__)
              std::FILE* f = std::fopen("/proc/meminfo", "r");
              if (!f) return 0;
              char line[256];
              uint64_t out = 0;
              while (std::fgets(line, sizeof line, f)) {
                  unsigned long long kb = 0;
                  if (std::sscanf(line, "MemAvailable: %llu kB", &kb) == 1) { out = uint64_t(kb) * KiB; break; }
              }
              std::fclose(f);
              return out;
          #else
              return 0;
          #endif
          }

          namespace crypto {
          namespace detail {
          inline uint32_t rotl(uint32_t x, int n) noexcept { return (x << n) | (x >> (32 - n)); }
          inline uint32_t ld32(const uint8_t* p) noexcept {
              return uint32_t(p[0]) | (uint32_t(p[1]) << 8) | (uint32_t(p[2]) << 16) | (uint32_t(p[3]) << 24);
          }
          inline void st32(uint8_t* p, uint32_t v) noexcept {
              p[0] = uint8_t(v); p[1] = uint8_t(v >> 8); p[2] = uint8_t(v >> 16); p[3] = uint8_t(v >> 24);
          }
          inline void quarter(uint32_t& a, uint32_t& b, uint32_t& c, uint32_t& d) noexcept {
              a += b; d ^= a; d = rotl(d, 16);
              c += d; b ^= c; b = rotl(b, 12);
              a += b; d ^= a; d = rotl(d, 8);
              c += d; b ^= c; b = rotl(b, 7);
          }
          inline void rounds20(uint32_t x[16]) noexcept {
              for (int i = 0; i < 10; ++i) {
                  quarter(x[0], x[4], x[8],  x[12]);
                  quarter(x[1], x[5], x[9],  x[13]);
                  quarter(x[2], x[6], x[10], x[14]);
                  quarter(x[3], x[7], x[11], x[15]);
                  quarter(x[0], x[5], x[10], x[15]);
                  quarter(x[1], x[6], x[11], x[12]);
                  quarter(x[2], x[7], x[8],  x[13]);
                  quarter(x[3], x[4], x[9],  x[14]);
              }
          }
          inline void initState(uint32_t x[16], const uint8_t key[32]) noexcept {
              x[0] = 0x61707865; x[1] = 0x3320646e; x[2] = 0x79622d32; x[3] = 0x6b206574;
              for (int i = 0; i < 8; ++i) x[4 + i] = ld32(key + 4 * i);
          }
          constexpr uint32_t M26 = 0x3ffffff;
          } // namespace detail

          inline void hchacha20(const uint8_t key[32], const uint8_t nonce16[16], uint8_t out[32]) noexcept {
              uint32_t x[16];
              detail::initState(x, key);
              for (int i = 0; i < 4; ++i) x[12 + i] = detail::ld32(nonce16 + 4 * i);
              detail::rounds20(x);
              const int idx[8] = {0, 1, 2, 3, 12, 13, 14, 15};
              for (int i = 0; i < 8; ++i) detail::st32(out + 4 * i, x[idx[i]]);
              secureWipe(x, sizeof x);
          }

          inline void chacha20Xor(const uint8_t key[32], const uint8_t nonce[12], uint32_t counter,
                                  uint8_t* data, size_t len) noexcept {
              uint32_t init[16];
              detail::initState(init, key);
              init[12] = counter;
              for (int i = 0; i < 3; ++i) init[13 + i] = detail::ld32(nonce + 4 * i);
              uint32_t x[16];
              uint8_t ks[64];
              while (len > 0) {
                  for (int i = 0; i < 16; ++i) x[i] = init[i];
                  detail::rounds20(x);
                  for (int i = 0; i < 16; ++i) detail::st32(ks + 4 * i, x[i] + init[i]);
                  const size_t n = len < 64 ? len : 64;
                  for (size_t i = 0; i < n; ++i) data[i] ^= ks[i];
                  data += n;
                  len -= n;
                  ++init[12];
              }
              secureWipe(x, sizeof x);
              secureWipe(init, sizeof init);
              secureWipe(ks, sizeof ks);
          }

          class Poly1305 {
          public:
              explicit Poly1305(const uint8_t key[32]) noexcept {
                  using namespace detail;
                  r_[0] = ld32(key + 0) & 0x3ffffff;
                  r_[1] = (ld32(key + 3) >> 2) & 0x3ffff03;
                  r_[2] = (ld32(key + 6) >> 4) & 0x3ffc0ff;
                  r_[3] = (ld32(key + 9) >> 6) & 0x3f03fff;
                  r_[4] = (ld32(key + 12) >> 8) & 0x00fffff;
                  for (int i = 0; i < 4; ++i) pad_[i] = ld32(key + 16 + 4 * i);
              }
              ~Poly1305() { secureWipe(this, sizeof *this); }
              Poly1305(const Poly1305&) = delete;
              Poly1305& operator=(const Poly1305&) = delete;

              void update(const uint8_t* m, size_t n) noexcept {
                  if (leftover_) {
                      size_t want = 16 - leftover_;
                      if (want > n) want = n;
                      std::memcpy(buf_ + leftover_, m, want);
                      n -= want; m += want; leftover_ += want;
                      if (leftover_ < 16) return;
                      blocks(buf_, 16, false);
                      leftover_ = 0;
                  }
                  if (n >= 16) {
                      const size_t full = n & ~size_t(15);
                      blocks(m, full, false);
                      m += full; n -= full;
                  }
                  if (n) { std::memcpy(buf_, m, n); leftover_ = n; }
              }

              void finish(uint8_t mac[16]) noexcept {
                  using namespace detail;
                  if (leftover_) {
                      buf_[leftover_] = 1;
                      for (size_t i = leftover_ + 1; i < 16; ++i) buf_[i] = 0;
                      blocks(buf_, 16, true);
                      leftover_ = 0;
                  }
                  uint32_t h0 = h_[0], h1 = h_[1], h2 = h_[2], h3 = h_[3], h4 = h_[4];
                  uint32_t c = h1 >> 26; h1 &= M26;
                  h2 += c; c = h2 >> 26; h2 &= M26;
                  h3 += c; c = h3 >> 26; h3 &= M26;
                  h4 += c; c = h4 >> 26; h4 &= M26;
                  h0 += c * 5; c = h0 >> 26; h0 &= M26;
                  h1 += c;

                  uint32_t g0 = h0 + 5; c = g0 >> 26; g0 &= M26;
                  uint32_t g1 = h1 + c; c = g1 >> 26; g1 &= M26;
                  uint32_t g2 = h2 + c; c = g2 >> 26; g2 &= M26;
                  uint32_t g3 = h3 + c; c = g3 >> 26; g3 &= M26;
                  uint32_t g4 = h4 + c - (1u << 26);

                  uint32_t mask = (g4 >> 31) - 1;
                  g0 &= mask; g1 &= mask; g2 &= mask; g3 &= mask; g4 &= mask;
                  mask = ~mask;
                  h0 = (h0 & mask) | g0; h1 = (h1 & mask) | g1; h2 = (h2 & mask) | g2;
                  h3 = (h3 & mask) | g3; h4 = (h4 & mask) | g4;

                  h0 = h0 | (h1 << 26);
                  h1 = (h1 >> 6) | (h2 << 20);
                  h2 = (h2 >> 12) | (h3 << 14);
                  h3 = (h3 >> 18) | (h4 << 8);

                  uint64_t f = uint64_t(h0) + pad_[0]; st32(mac + 0, uint32_t(f));
                  f = uint64_t(h1) + pad_[1] + (f >> 32); st32(mac + 4, uint32_t(f));
                  f = uint64_t(h2) + pad_[2] + (f >> 32); st32(mac + 8, uint32_t(f));
                  f = uint64_t(h3) + pad_[3] + (f >> 32); st32(mac + 12, uint32_t(f));

                  secureWipe(h_, sizeof h_);
                  secureWipe(r_, sizeof r_);
                  secureWipe(pad_, sizeof pad_);
                  secureWipe(buf_, sizeof buf_);
              }

          private:
              void blocks(const uint8_t* m, size_t bytes, bool fin) noexcept {
                  using namespace detail;
                  const uint32_t hibit = fin ? 0u : (1u << 24);
                  const uint32_t r0 = r_[0], r1 = r_[1], r2 = r_[2], r3 = r_[3], r4 = r_[4];
                  const uint32_t s1 = r1 * 5, s2 = r2 * 5, s3 = r3 * 5, s4 = r4 * 5;
                  uint32_t h0 = h_[0], h1 = h_[1], h2 = h_[2], h3 = h_[3], h4 = h_[4];

                  while (bytes >= 16) {
                      h0 += ld32(m + 0) & M26;
                      h1 += (ld32(m + 3) >> 2) & M26;
                      h2 += (ld32(m + 6) >> 4) & M26;
                      h3 += (ld32(m + 9) >> 6) & M26;
                      h4 += (ld32(m + 12) >> 8) | hibit;

                      uint64_t d0 = uint64_t(h0)*r0 + uint64_t(h1)*s4 + uint64_t(h2)*s3 + uint64_t(h3)*s2 + uint64_t(h4)*s1;
                      uint64_t d1 = uint64_t(h0)*r1 + uint64_t(h1)*r0 + uint64_t(h2)*s4 + uint64_t(h3)*s3 + uint64_t(h4)*s2;
                      uint64_t d2 = uint64_t(h0)*r2 + uint64_t(h1)*r1 + uint64_t(h2)*r0 + uint64_t(h3)*s4 + uint64_t(h4)*s3;
                      uint64_t d3 = uint64_t(h0)*r3 + uint64_t(h1)*r2 + uint64_t(h2)*r1 + uint64_t(h3)*r0 + uint64_t(h4)*s4;
                      uint64_t d4 = uint64_t(h0)*r4 + uint64_t(h1)*r3 + uint64_t(h2)*r2 + uint64_t(h3)*r1 + uint64_t(h4)*r0;

                      uint32_t c = uint32_t(d0 >> 26); h0 = uint32_t(d0) & M26;
                      d1 += c; c = uint32_t(d1 >> 26); h1 = uint32_t(d1) & M26;
                      d2 += c; c = uint32_t(d2 >> 26); h2 = uint32_t(d2) & M26;
                      d3 += c; c = uint32_t(d3 >> 26); h3 = uint32_t(d3) & M26;
                      d4 += c; c = uint32_t(d4 >> 26); h4 = uint32_t(d4) & M26;
                      h0 += c * 5; c = h0 >> 26; h0 &= M26;
                      h1 += c;

                      m += 16;
                      bytes -= 16;
                  }
                  h_[0] = h0; h_[1] = h1; h_[2] = h2; h_[3] = h3; h_[4] = h4;
              }

              uint32_t r_[5]{}, h_[5]{}, pad_[4]{};
              uint8_t buf_[16]{};
              size_t leftover_ = 0;
          };

          inline void aeadTag(const uint8_t key[32], const uint8_t nonce[12], const uint8_t* aad, size_t aadLen,
                              const uint8_t* ct, size_t ctLen, uint8_t tag[16]) noexcept {
              uint8_t polyKey[32] = {0};
              chacha20Xor(key, nonce, 0, polyKey, sizeof polyKey);
              {
                  Poly1305 mac(polyKey);
                  static const uint8_t zeros[16] = {0};
                  uint8_t lens[16];
                  for (int i = 0; i < 8; ++i) {
                      lens[i]     = uint8_t(uint64_t(aadLen) >> (8 * i));
                      lens[8 + i] = uint8_t(uint64_t(ctLen) >> (8 * i));
                  }
                  mac.update(aad, aadLen);
                  mac.update(zeros, (16 - aadLen % 16) % 16);
                  mac.update(ct, ctLen);
                  mac.update(zeros, (16 - ctLen % 16) % 16);
                  mac.update(lens, 16);
                  mac.finish(tag);
              }
              secureWipe(polyKey, sizeof polyKey);
          }

          inline void xSeal(const uint8_t key[32], const uint8_t nonce24[24],
                            const uint8_t* aad, size_t aadLen,
                            const uint8_t* pt, size_t len, uint8_t* ct, uint8_t tag[16]) noexcept {
              uint8_t sub[32];
              uint8_t n12[12] = {0, 0, 0, 0};
              hchacha20(key, nonce24, sub);
              std::memcpy(n12 + 4, nonce24 + 16, 8);
              if (ct != pt && len) std::memcpy(ct, pt, len);
              chacha20Xor(sub, n12, 1, ct, len);
              aeadTag(sub, n12, aad, aadLen, ct, len, tag);
              secureWipe(sub, sizeof sub);
          }

          inline bool xOpen(const uint8_t key[32], const uint8_t nonce24[24],
                            const uint8_t* aad, size_t aadLen,
                            const uint8_t* ct, size_t len, const uint8_t tag[16], uint8_t* pt) noexcept {
              uint8_t sub[32];
              uint8_t n12[12] = {0, 0, 0, 0};
              uint8_t expect[16];
              hchacha20(key, nonce24, sub);
              std::memcpy(n12 + 4, nonce24 + 16, 8);
              aeadTag(sub, n12, aad, aadLen, ct, len, expect);
              const bool ok = constTimeEqual(expect, tag, 16);
              if (ok) {
                  if (pt != ct && len) std::memcpy(pt, ct, len);
                  chacha20Xor(sub, n12, 1, pt, len);
              }
              secureWipe(expect, sizeof expect);
              secureWipe(sub, sizeof sub);
              return ok;
          }

          inline bool poly1305SelfTest() noexcept {
              const uint8_t key[32] = {
                  0x85,0xd6,0xbe,0x78,0x57,0x55,0x6d,0x33,0x7f,0x44,0x52,0xfe,0x42,0xd5,0x06,0xa8,
                  0x01,0x03,0x80,0x8a,0xfb,0x0d,0xb2,0xfd,0x4a,0xbf,0xf6,0xaf,0x41,0x49,0xf5,0x1b};
              const uint8_t expect[16] = {
                  0xa8,0x06,0x1d,0xc1,0x30,0x51,0x36,0xc6,0xc2,0x2b,0x8b,0xaf,0x0c,0x01,0x27,0xa9};
              const char* msg = "Cryptographic Forum Research Group";
              Poly1305 p(key);
              p.update(reinterpret_cast<const uint8_t*>(msg), std::strlen(msg));
              uint8_t tag[16];
              p.finish(tag);
              return constTimeEqual(tag, expect, 16);
          }
          } // namespace crypto

          class IBlockStore {
          public:
              virtual ~IBlockStore() = default;
              virtual bool read(uint64_t off, uint8_t* buf, size_t n) = 0;
              virtual bool write(uint64_t off, const uint8_t* buf, size_t n) = 0;
              virtual bool sync() = 0;
              virtual bool size(uint64_t& out) const = 0;
              virtual bool freeSpace(uint64_t& out) const = 0;
              virtual bool erase() { return false; }
              virtual void close() noexcept {}
          };

          #if !defined(SD_WEB)
          class FileBlockStore final : public IBlockStore {
          public:
              static std::unique_ptr<FileBlockStore> create(const std::string& dir) {
                  if (dir.empty() || dir.size() > sd::kMaxPathLen) return nullptr;
                  std::unique_ptr<FileBlockStore> s(new FileBlockStore(dir));
                  if (!s->openFile()) return nullptr;
                  return s;
              }
              ~FileBlockStore() override { close(); }
              bool read(uint64_t off, uint8_t* b, size_t n) override { return io(off, b, n, false); }
              bool write(uint64_t off, const uint8_t* b, size_t n) override {
                  return io(off, const_cast<uint8_t*>(b), n, true);
              }
              bool sync() override {
              #if SD_POSIX
                  return fd_ >= 0 && ::fsync(fd_) == 0;
              #else
                  return h_ != INVALID_HANDLE_VALUE && FlushFileBuffers(h_) != 0;
              #endif
              }
              bool size(uint64_t& out) const override {
              #if SD_POSIX
                  struct stat st{};
                  if (fd_ < 0 || fstat(fd_, &st) != 0 || st.st_size < 0) return false;
                  out = uint64_t(st.st_size);
                  return true;
              #else
                  LARGE_INTEGER li{};
                  if (h_ == INVALID_HANDLE_VALUE || !GetFileSizeEx(h_, &li)) return false;
                  out = uint64_t(li.QuadPart);
                  return true;
              #endif
              }
              bool freeSpace(uint64_t& out) const override {
              #if SD_POSIX
                  struct statvfs sv{};
                  if (statvfs(dir_.c_str(), &sv) != 0) return false;
                  out = uint64_t(sv.f_bavail) * uint64_t(sv.f_frsize);
                  return true;
              #else
                  ULARGE_INTEGER avail{};
                  if (!GetDiskFreeSpaceExA(dir_.c_str(), &avail, nullptr, nullptr)) return false;
                  out = uint64_t(avail.QuadPart);
                  return true;
              #endif
              }
              bool erase() override {
                  close();
              #if SD_POSIX
                  return ::unlink(path_.c_str()) == 0;
              #else
                  return DeleteFileA(path_.c_str()) != 0;
              #endif
              }
              void close() noexcept override {
              #if SD_POSIX
                  if (fd_ >= 0) { ::close(fd_); fd_ = -1; }
              #else
                  if (h_ != INVALID_HANDLE_VALUE) { CloseHandle(h_); h_ = INVALID_HANDLE_VALUE; }
              #endif
              }
          private:
              explicit FileBlockStore(std::string dir) : dir_(std::move(dir)), path_(dir_ + "/sd_store.bin") {}
              bool openFile() {
              #if SD_POSIX
                  fd_ = ::open(path_.c_str(), O_RDWR | O_CREAT | O_CLOEXEC | O_NOFOLLOW, 0600);
                  if (fd_ < 0) return false;
                  struct stat st{};
                  if (fstat(fd_, &st) != 0 || !S_ISREG(st.st_mode)) { ::close(fd_); fd_ = -1; return false; }
                  return true;
              #else
                  h_ = CreateFileA(path_.c_str(), GENERIC_READ | GENERIC_WRITE, 0, nullptr, OPEN_ALWAYS, FILE_ATTRIBUTE_NORMAL, nullptr);
                  return h_ != INVALID_HANDLE_VALUE;
              #endif
              }
              bool io(uint64_t off, void* p, size_t n, bool wr) {
                  auto* bytes = static_cast<uint8_t*>(p);
                  size_t done = 0;
              #if SD_POSIX
                  if (fd_ < 0) return false;
                  while (done < n) {
                      const off_t pos = static_cast<off_t>(off + done);
                      const ssize_t r = wr ? ::pwrite(fd_, bytes + done, n - done, pos) : ::pread(fd_, bytes + done, n - done, pos);
                      if (r < 0 && errno == EINTR) continue;
                      if (r <= 0) return false;
                      done += size_t(r);
                  }
                  return true;
              #else
                  if (h_ == INVALID_HANDLE_VALUE) return false;
                  while (done < n) {
                      const uint64_t pos = off + done;
                      OVERLAPPED ov{};
                      ov.Offset = DWORD(pos & 0xffffffffu);
                      ov.OffsetHigh = DWORD(pos >> 32);
                      const DWORD want = DWORD((std::min)(n - done, size_t(1) << 30));
                      DWORD got = 0;
                      const BOOL ok = wr ? WriteFile(h_, bytes + done, want, &got, &ov) : ReadFile(h_, bytes + done, want, &got, &ov);
                      if (!ok || got == 0) return false;
                      done += got;
                  }
                  return true;
              #endif
              }
              std::string dir_;
              std::string path_;
          #if SD_WINDOWS
              HANDLE h_ = INVALID_HANDLE_VALUE;
          #else
              int fd_ = -1;
          #endif
          };
          #endif

          class MemoryBlockStore final : public IBlockStore {
          public:
              explicit MemoryBlockStore(uint64_t quota = 0) : quota_(quota ? quota : UINT64_MAX) {}
              ~MemoryBlockStore() override { erase(); }
              bool read(uint64_t off, uint8_t* b, size_t n) override {
                  if (off > data_.size() || n > data_.size() - off) return false;
                  std::memcpy(b, data_.data() + off, n);
                  return true;
              }
              bool write(uint64_t off, const uint8_t* b, size_t n) override {
                  if (off > quota_ || n > quota_ - off) return false;
                  const uint64_t need = off + n;
                  if (need > data_.size()) {
                      std::vector<uint8_t> grown(size_t(need), 0);
                      if (!data_.empty()) std::memcpy(grown.data(), data_.data(), data_.size());
                      if (!data_.empty()) sd::secureWipe(data_.data(), data_.size());
                      data_.swap(grown);
                  }
                  std::memcpy(data_.data() + off, b, n);
                  return true;
              }
              bool sync() override { return true; }
              bool size(uint64_t& out) const override { out = data_.size(); return true; }
              bool freeSpace(uint64_t& out) const override {
                  const uint64_t used = data_.size();
                  out = quota_ > used ? quota_ - used : 0;
                  return true;
              }
              bool erase() override {
                  if (!data_.empty()) sd::secureWipe(data_.data(), data_.size());
                  data_.clear();
                  return true;
              }
          private:
              std::vector<uint8_t> data_;
              uint64_t quota_;
          };

          struct CallbackOps {
              std::function<bool(uint64_t, uint8_t*, size_t)> read;
              std::function<bool(uint64_t, const uint8_t*, size_t)> write;
              std::function<bool()> sync;
              std::function<bool(uint64_t&)> size;
              std::function<bool(uint64_t&)> freeSpace;
              std::function<bool()> erase;
          };

          class CallbackBlockStore final : public IBlockStore {
          public:
              explicit CallbackBlockStore(CallbackOps ops) : ops_(std::move(ops)) {}
              bool read(uint64_t off, uint8_t* b, size_t n) override { return bool(ops_.read) && ops_.read(off, b, n); }
              bool write(uint64_t off, const uint8_t* b, size_t n) override { return bool(ops_.write) && ops_.write(off, b, n); }
              bool sync() override { return !ops_.sync || ops_.sync(); }
              bool size(uint64_t& out) const override { return bool(ops_.size) && ops_.size(out); }
              bool freeSpace(uint64_t& out) const override { return bool(ops_.freeSpace) && ops_.freeSpace(out); }
              bool erase() override { return bool(ops_.erase) && ops_.erase(); }
          private:
              CallbackOps ops_;
          };

          class SecureBytes {
          public:
              SecureBytes() = default;
              explicit SecureBytes(size_t n) : buf_(n, 0) {}
              ~SecureBytes() { wipe(); }
              SecureBytes(const SecureBytes&) = delete;
              SecureBytes& operator=(const SecureBytes&) = delete;
              SecureBytes(SecureBytes&& o) noexcept : buf_(std::move(o.buf_)) { o.buf_.clear(); }
              SecureBytes& operator=(SecureBytes&& o) noexcept {
                  if (this != &o) { wipe(); buf_ = std::move(o.buf_); o.buf_.clear(); }
                  return *this;
              }
              uint8_t* data() noexcept { return buf_.data(); }
              const uint8_t* data() const noexcept { return buf_.data(); }
              size_t size() const noexcept { return buf_.size(); }
              void wipe() noexcept {
                  if (!buf_.empty()) sd::secureWipe(buf_.data(), buf_.size());
                  std::vector<uint8_t>().swap(buf_);
              }
          private:
              std::vector<uint8_t> buf_;
          };

          namespace sd {
          namespace detail {
          inline void put32(uint8_t* p, uint32_t v) noexcept { for (int i = 0; i < 4; ++i) p[i] = uint8_t(v >> (8 * i)); }
          inline void put64(uint8_t* p, uint64_t v) noexcept { for (int i = 0; i < 8; ++i) p[i] = uint8_t(v >> (8 * i)); }
          inline uint32_t get32(const uint8_t* p) noexcept {
              uint32_t v = 0; for (int i = 0; i < 4; ++i) v |= uint32_t(p[i]) << (8 * i); return v;
          }
          inline uint64_t get64(const uint8_t* p) noexcept {
              uint64_t v = 0; for (int i = 0; i < 8; ++i) v |= uint64_t(p[i]) << (8 * i); return v;
          }
          inline void makeAad(uint8_t (&a)[kAadLen], uint64_t idx, uint32_t cb, uint32_t kind) noexcept {
              put64(a, idx); put32(a + 8, cb); put32(a + 12, kind);
          }
          inline uint64_t ceilDiv(uint64_t a, uint64_t b) noexcept { return (a + b - 1) / b; }
          inline bool isPow2(uint32_t v) noexcept { return v != 0 && (v & (v - 1)) == 0; }
          } // namespace detail

          class Engine {
          public:
              static Err open(const Config& cfg, std::unique_ptr<IBlockStore> store,
                              const uint8_t* key, size_t keyLen, std::unique_ptr<Engine>& out) noexcept;
              ~Engine() { close(); }
              Engine(const Engine&) = delete;
              Engine& operator=(const Engine&) = delete;

              Err write(uint64_t off, const uint8_t* data, uint64_t len) noexcept;
              Err write(uint64_t off, std::string_view data) noexcept {
                  return write(off, reinterpret_cast<const uint8_t*>(data.data()), static_cast<uint64_t>(data.size()));
              }
              Err read(uint64_t off, uint8_t* out, uint64_t len) noexcept;
              Err read(uint64_t off, MutableBytes dst) noexcept { return read(off, dst.data, dst.size); }
              Err resize(uint64_t newCapacity) noexcept;
              Err destroy() noexcept;
              void close() noexcept;
              void setCacheBytes(uint64_t requested) noexcept;
              void refreshCacheBudget() noexcept;
              void trimCache() noexcept;
              uint64_t size() const noexcept;
              uint64_t capacity() const noexcept;
              uint32_t chunkBytes() const noexcept { return chunkBytes_; }

          private:
              using Chunk = std::shared_ptr<SecureBytes>;
              using LruList = std::list<std::pair<uint64_t, Chunk>>;
              struct CacheShard {
                  std::mutex mu;
                  LruList lru;
                  std::unordered_map<uint64_t, LruList::iterator> index;
                  size_t maxEntries = 0;
              };
              Engine() = default;
              uint64_t slotBytes() const noexcept { return kNonce + chunkBytes_ + kTag; }
              uint64_t slotOffset(uint64_t idx) const noexcept { return kHeaderBytes + idx * slotBytes(); }
              Err writeHeaderLocked();
              Err readHeaderLocked(uint32_t& cb, uint64_t& cap, uint64_t& logical);
              Err loadChunkLocked(uint64_t idx, Chunk& out);
              Err storeChunkLocked(uint64_t idx, const uint8_t* pt);
              Chunk cacheGet(uint64_t idx) noexcept;
              void cachePut(uint64_t idx, Chunk p) noexcept;
              static void evictShardLocked(CacheShard& s) noexcept;
              void applyCacheLocked() noexcept;

              std::unique_ptr<IBlockStore> store_;
              std::array<uint8_t, kKey> key_{};
              bool keyValid_ = false;
              uint32_t chunkBytes_ = 0;
              uint64_t capacity_ = 0;
              uint64_t logical_ = 0;
              mutable std::shared_mutex mu_;
              mutable std::mutex cfgMu_;
              uint64_t requestedCache_ = 0;
              uint64_t cacheBytes_ = 0;
              std::array<CacheShard, kCacheShards> shards_;
          };

          inline uint64_t clampCache(uint64_t req) noexcept {
              const uint64_t ram = availableRamBytes();
              uint64_t hi = kMaxCache;
              hi = (std::min)(hi, ram ? ram / kMaxRamCacheFrac : kFallbackRamBytes);
              return (std::max)((std::min)(req, hi), kMinCache);
          }

          inline Err Engine::open(const Config& in, std::unique_ptr<IBlockStore> store,
                                  const uint8_t* key, size_t keyLen, std::unique_ptr<Engine>& out) noexcept {
              try {
                  if (!store) return Err::BadConfig;
                  if (!key || keyLen != kKey) return Err::BadKey;
                  if (in.capacityBytes < kMinCapacity || in.capacityBytes > kMaxCapacity) return Err::BadConfig;
                  if (in.chunkBytes < kMinChunk || in.chunkBytes > kMaxChunk || !detail::isPow2(in.chunkBytes))
                      return Err::BadConfig;
                  uint64_t storeSize = 0;
                  if (!store->size(storeSize)) return Err::Io;
                  std::unique_ptr<Engine> e(new Engine());
                  std::memcpy(e->key_.data(), key, kKey);
                  e->keyValid_ = true;
                  e->chunkBytes_ = in.chunkBytes;
                  e->capacity_ = in.capacityBytes;
                  e->requestedCache_ = in.cacheBytes;
                  e->store_ = std::move(store);
                  if (storeSize == 0) {
                      Err r = e->writeHeaderLocked();
                      if (r != Err::Ok) return r;
                  } else {
                      uint32_t cb = 0;
                      uint64_t cap = 0, logical = 0;
                      Err r = e->readHeaderLocked(cb, cap, logical);
                      if (r != Err::Ok) return r;
                      if (logical > in.capacityBytes) return Err::TooLarge;
                      e->chunkBytes_ = cb;
                      e->logical_ = logical;
                      if (cap != in.capacityBytes) {
                          r = e->writeHeaderLocked();
                          if (r != Err::Ok) return r;
                      }
                  }
                  {
                      std::lock_guard<std::mutex> g(e->cfgMu_);
                      e->applyCacheLocked();
                  }
                  out = std::move(e);
                  return Err::Ok;
              } catch (const std::bad_alloc&) { return Err::NoRam; }
              catch (...) { return Err::Io; }
          }

          inline Err Engine::writeHeaderLocked() {
              uint8_t pt[kHdrPlain] = {0};
              detail::put32(pt + 0, kMagic);
              detail::put32(pt + 4, kVersion);
              detail::put32(pt + 8, chunkBytes_);
              detail::put64(pt + 16, capacity_);
              detail::put64(pt + 24, logical_);
              uint8_t rec[kHdrRec];
              if (!fillRandom(rec, kNonce)) { secureWipe(pt, sizeof pt); return Err::Crypto; }
              uint8_t aad[kAadLen];
              detail::makeAad(aad, 0, 0, kKindHeader);
              crypto::xSeal(key_.data(), rec, aad, sizeof aad, pt, kHdrPlain, rec + kNonce, rec + kNonce + kHdrPlain);
              secureWipe(pt, sizeof pt);
              if (!store_->write(0, rec, kHdrRec)) return Err::Io;
              if (!store_->sync()) return Err::Io;
              return Err::Ok;
          }

          inline Err Engine::readHeaderLocked(uint32_t& cb, uint64_t& cap, uint64_t& logical) {
              uint8_t rec[kHdrRec];
              if (!store_->read(0, rec, kHdrRec)) return Err::Format;
              uint8_t aad[kAadLen];
              detail::makeAad(aad, 0, 0, kKindHeader);
              uint8_t pt[kHdrPlain];
              if (!crypto::xOpen(key_.data(), rec, aad, sizeof aad, rec + kNonce, kHdrPlain, rec + kNonce + kHdrPlain, pt)) {
                  return Err::Crypto;
              }
              if (detail::get32(pt) != kMagic || detail::get32(pt + 4) != kVersion) {
                  secureWipe(pt, sizeof pt);
                  return Err::Format;
              }
              cb = detail::get32(pt + 8);
              cap = detail::get64(pt + 16);
              logical = detail::get64(pt + 24);
              secureWipe(pt, sizeof pt);
              if (cb < kMinChunk || cb > kMaxChunk || !detail::isPow2(cb)) return Err::Format;
              if (cap < kMinCapacity || cap > kMaxCapacity || logical > cap) return Err::Format;
              return Err::Ok;
          }

          inline Err Engine::loadChunkLocked(uint64_t idx, Chunk& out) {
              out = cacheGet(idx);
              if (out) return Err::Ok;
              auto buf = std::make_shared<SecureBytes>(chunkBytes_);
              if (idx * uint64_t(chunkBytes_) < logical_) {
                  std::vector<uint8_t> rec(slotBytes());
                  if (!store_->read(slotOffset(idx), rec.data(), rec.size())) return Err::Io;
                  uint8_t aad[kAadLen];
                  detail::makeAad(aad, idx, chunkBytes_, kKindChunk);
                  if (!crypto::xOpen(key_.data(), rec.data(), aad, sizeof aad, rec.data() + kNonce, chunkBytes_, rec.data() + kNonce + chunkBytes_, buf->data())) {
                      return Err::Crypto;
                  }
              }
              cachePut(idx, buf);
              out = buf;
              return Err::Ok;
          }

          inline Err Engine::storeChunkLocked(uint64_t idx, const uint8_t* pt) {
              std::vector<uint8_t> rec(slotBytes());
              if (!fillRandom(rec.data(), kNonce)) return Err::Crypto;
              uint8_t aad[kAadLen];
              detail::makeAad(aad, idx, chunkBytes_, kKindChunk);
              crypto::xSeal(key_.data(), rec.data(), aad, sizeof aad, pt, chunkBytes_, rec.data() + kNonce, rec.data() + kNonce + chunkBytes_);
              if (!store_->write(slotOffset(idx), rec.data(), rec.size())) return Err::Io;
              return Err::Ok;
          }

          inline Err Engine::write(uint64_t off, const uint8_t* data, uint64_t len) noexcept {
              try {
                  if (len == 0) return Err::Ok;
                  if (!data) return Err::BadArg;
                  if (len > kMaxIoPerCall) return Err::TooLarge;
                  std::unique_lock<std::shared_mutex> lk(mu_);
                  if (!keyValid_) return Err::NotOpen;
                  if (off > logical_ || off > capacity_ || len > capacity_ - off) return Err::OutOfRange;
                  const uint64_t end = off + len;
                  if (end > logical_) {
                      const uint64_t newSlots = detail::ceilDiv(end, chunkBytes_) - detail::ceilDiv(logical_, chunkBytes_);
                      const uint64_t grow = newSlots * slotBytes();
                      const uint64_t need = grow + grow / 20 + kMinFreeAfterGrowth;
                      uint64_t avail = 0;
                      if (store_->freeSpace(avail) && avail < need) return Err::NoSpace;
                  }
                  uint64_t done = 0;
                  while (done < len) {
                      const uint64_t pos = off + done;
                      const uint64_t idx = pos / chunkBytes_;
                      const uint64_t within = pos % chunkBytes_;
                      const uint64_t take = (std::min<uint64_t>)(chunkBytes_ - within, len - done);
                      auto upd = std::make_shared<SecureBytes>(chunkBytes_);
                      if (take != chunkBytes_) {
                          Chunk old;
                          Err e = loadChunkLocked(idx, old);
                          if (e != Err::Ok) return e;
                          std::memcpy(upd->data(), old->data(), chunkBytes_);
                      }
                      std::memcpy(upd->data() + within, data + done, size_t(take));
                      Err e = storeChunkLocked(idx, upd->data());
                      if (e != Err::Ok) return e;
                      cachePut(idx, upd);
                      done += take;
                  }
                  if (!store_->sync()) return Err::Io;
                  const uint64_t prev = logical_;
                  logical_ = (std::max)(logical_, end);
                  Err h = writeHeaderLocked();
                  if (h != Err::Ok) { logical_ = prev; return h; }
                  return Err::Ok;
              } catch (const std::bad_alloc&) { return Err::NoRam; }
              catch (...) { return Err::Io; }
          }

          inline Err Engine::read(uint64_t off, uint8_t* out, uint64_t len) noexcept {
              try {
                  if (len == 0) return Err::Ok;
                  if (!out) return Err::BadArg;
                  if (len > kMaxIoPerCall) return Err::TooLarge;
                  std::shared_lock<std::shared_mutex> lk(mu_);
                  if (!keyValid_) return Err::NotOpen;
                  if (off > logical_ || len > logical_ - off) return Err::OutOfRange;
                  uint64_t done = 0;
                  while (done < len) {
                      const uint64_t pos = off + done;
                      const uint64_t idx = pos / chunkBytes_;
                      const uint64_t within = pos % chunkBytes_;
                      const uint64_t take = (std::min<uint64_t>)(chunkBytes_ - within, len - done);
                      Chunk c;
                      Err e = loadChunkLocked(idx, c);
                      if (e != Err::Ok) { secureWipe(out, size_t(len)); return e; }
                      std::memcpy(out + done, c->data() + within, size_t(take));
                      done += take;
                  }
                  return Err::Ok;
              } catch (const std::bad_alloc&) { return Err::NoRam; }
              catch (...) { return Err::Io; }
          }

          inline Err Engine::resize(uint64_t newCap) noexcept {
              try {
                  if (newCap < kMinCapacity || newCap > kMaxCapacity) return Err::BadConfig;
                  std::unique_lock<std::shared_mutex> lk(mu_);
                  if (!keyValid_) return Err::NotOpen;
                  if (newCap < logical_) return Err::OutOfRange;
                  const uint64_t prev = capacity_;
                  capacity_ = newCap;
                  Err h = writeHeaderLocked();
                  if (h != Err::Ok) { capacity_ = prev; return h; }
                  return Err::Ok;
              } catch (const std::bad_alloc&) { return Err::NoRam; }
              catch (...) { return Err::Io; }
          }

          inline Err Engine::destroy() noexcept {
              try {
                  std::unique_lock<std::shared_mutex> lk(mu_);
                  keyValid_ = false;
                  secureWipe(key_.data(), key_.size());
                  logical_ = 0;
                  trimCache();
                  const bool ok = store_ && store_->erase();
                  return ok ? Err::Ok : Err::Io;
              } catch (...) { return Err::Io; }
          }

          inline void Engine::close() noexcept {
              try {
                  std::unique_lock<std::shared_mutex> lk(mu_);
                  if (store_) { store_->sync(); store_->close(); }
                  keyValid_ = false;
                  secureWipe(key_.data(), key_.size());
                  trimCache();
              } catch (...) { secureWipe(key_.data(), key_.size()); }
          }

          inline uint64_t Engine::size() const noexcept {
              std::shared_lock<std::shared_mutex> l(mu_);
              return logical_;
          }
          inline uint64_t Engine::capacity() const noexcept {
              std::shared_lock<std::shared_mutex> l(mu_);
              return capacity_;
          }

          inline void Engine::evictShardLocked(CacheShard& s) noexcept {
              while (s.lru.size() > s.maxEntries) {
                  s.index.erase(s.lru.back().first);
                  s.lru.pop_back();
              }
          }

          inline void Engine::applyCacheLocked() noexcept {
              cacheBytes_ = clampCache(requestedCache_);
              const uint64_t total = cacheBytes_ / chunkBytes_;
              for (size_t i = 0; i < kCacheShards; ++i) {
                  CacheShard& s = shards_[i];
                  std::lock_guard<std::mutex> g(s.mu);
                  s.maxEntries = size_t(total / kCacheShards + (i < total % kCacheShards ? 1 : 0));
                  evictShardLocked(s);
              }
          }

          inline void Engine::setCacheBytes(uint64_t requested) noexcept {
              try {
                  std::lock_guard<std::mutex> g(cfgMu_);
                  requestedCache_ = requested;
                  applyCacheLocked();
              } catch (...) {}
          }

          inline void Engine::refreshCacheBudget() noexcept {
              try {
                  std::lock_guard<std::mutex> g(cfgMu_);
                  applyCacheLocked();
              } catch (...) {}
          }

          inline void Engine::trimCache() noexcept {
              for (auto& s : shards_) {
                  try {
                      std::lock_guard<std::mutex> g(s.mu);
                      s.index.clear();
                      s.lru.clear();
                  } catch (...) {}
              }
          }

          inline Engine::Chunk Engine::cacheGet(uint64_t idx) noexcept {
              try {
                  CacheShard& s = shards_[idx % kCacheShards];
                  std::lock_guard<std::mutex> g(s.mu);
                  auto it = s.index.find(idx);
                  if (it == s.index.end()) return nullptr;
                  s.lru.splice(s.lru.begin(), s.lru, it->second);
                  return it->second->second;
              } catch (...) { return nullptr; }
          }

          inline void Engine::cachePut(uint64_t idx, Chunk p) noexcept {
              try {
                  CacheShard& s = shards_[idx % kCacheShards];
                  std::lock_guard<std::mutex> g(s.mu);
                  auto it = s.index.find(idx);
                  if (s.maxEntries == 0) {
                      if (it != s.index.end()) { s.lru.erase(it->second); s.index.erase(it); }
                      return;
                  }
                  if (it != s.index.end()) {
                      it->second->second = std::move(p);
                      s.lru.splice(s.lru.begin(), s.lru, it->second);
                  } else {
                      s.lru.emplace_front(idx, std::move(p));
                      s.index[idx] = s.lru.begin();
                  }
                  evictShardLocked(s);
              } catch (...) {}
          }
          } // namespace sd

          #define SD_STATUS_LIST(X) \
              X(SD_OK, 0) X(SD_ERR_NOT_OPEN, 1) X(SD_ERR_BAD_CONFIG, 2) X(SD_ERR_BAD_KEY, 3) \
              X(SD_ERR_BAD_ARG, 4) X(SD_ERR_OUT_OF_RANGE, 5) X(SD_ERR_TOO_LARGE, 6) X(SD_ERR_NO_SPACE, 7) \
              X(SD_ERR_NO_RAM, 8) X(SD_ERR_IO, 9) X(SD_ERR_CRYPTO, 10) X(SD_ERR_FORMAT, 11)

          typedef enum sd_status {
          #define SD_DECL_STATUS(name, val) name = val,
              SD_STATUS_LIST(SD_DECL_STATUS)
          #undef SD_DECL_STATUS
          } sd_status;

          typedef struct sd_config_c {
              uint64_t capacity_bytes;
              uint64_t cache_bytes;
              uint32_t chunk_bytes;
          } sd_config_c;

          typedef struct sd_store_vtable {
              void* ctx;
              int (*read)(void* ctx, uint64_t off, uint8_t* buf, size_t n);
              int (*write)(void* ctx, uint64_t off, const uint8_t* buf, size_t n);
              int (*sync)(void* ctx);
              int (*size)(void* ctx, uint64_t* out_size);
              int (*free_space)(void* ctx, uint64_t* out_free);
              int (*erase)(void* ctx);
          } sd_store_vtable;

          typedef int (*sd_random_fn)(uint8_t* buf, size_t n);

          struct sd_engine {
              std::unique_ptr<sd::Engine> impl;
          };

          namespace sd_detail {
          struct Registry {
              std::shared_mutex mu;
              std::unordered_set<const sd_engine*> live;
          };
          inline Registry& registry() noexcept {
              static Registry r;
              return r;
          }

          inline sd_status toStatus(sd::Err e) noexcept {
              switch (e) {
                  case sd::Err::Ok: return SD_OK;
                  case sd::Err::NotOpen: return SD_ERR_NOT_OPEN;
                  case sd::Err::BadConfig: return SD_ERR_BAD_CONFIG;
                  case sd::Err::BadKey: return SD_ERR_BAD_KEY;
                  case sd::Err::BadArg: return SD_ERR_BAD_ARG;
                  case sd::Err::OutOfRange: return SD_ERR_OUT_OF_RANGE;
                  case sd::Err::TooLarge: return SD_ERR_TOO_LARGE;
                  case sd::Err::NoSpace: return SD_ERR_NO_SPACE;
                  case sd::Err::NoRam: return SD_ERR_NO_RAM;
                  case sd::Err::Io: return SD_ERR_IO;
                  case sd::Err::Crypto: return SD_ERR_CRYPTO;
                  case sd::Err::Format: return SD_ERR_FORMAT;
              }
              return SD_ERR_IO;
          }

          inline sd::Config toConfig(const sd_config_c& c) {
              sd::Config cfg;
              cfg.capacityBytes = c.capacity_bytes;
              cfg.cacheBytes = c.cache_bytes ? c.cache_bytes : sd::kDefaultCache;
              cfg.chunkBytes = c.chunk_bytes ? c.chunk_bytes : sd::kDefaultChunk;
              return cfg;
          }

          inline bool boundedCString(const char* s, size_t maxLen) noexcept {
              if (!s) return false;
              return std::memchr(s, '\0', maxLen + 1) != nullptr;
          }

          template <typename Fn>
          inline sd_status runStatus(const sd_engine* e, Fn&& fn) noexcept {
              if (!e) return SD_ERR_NOT_OPEN;
              try {
                  Registry& r = registry();
                  std::shared_lock<std::shared_mutex> lk(r.mu);
                  if (r.live.find(e) == r.live.end()) return SD_ERR_NOT_OPEN;
                  return toStatus(fn(*e->impl));
              } catch (const std::bad_alloc&) { return SD_ERR_NO_RAM; }
              catch (...) { return SD_ERR_IO; }
          }

          template <typename T, typename Fn>
          inline T runValue(const sd_engine* e, T fallback, Fn&& fn) noexcept {
              if (!e) return fallback;
              try {
                  Registry& r = registry();
                  std::shared_lock<std::shared_mutex> lk(r.mu);
                  if (r.live.find(e) == r.live.end()) return fallback;
                  return fn(*e->impl);
              } catch (...) { return fallback; }
          }

          inline sd_status finishOpen(sd::Err e, std::unique_ptr<sd::Engine>& eng, sd_engine** out) {
              if (e != sd::Err::Ok) return toStatus(e);
              std::unique_ptr<sd_engine> h(new (std::nothrow) sd_engine{std::move(eng)});
              if (!h) return SD_ERR_NO_RAM;
              try {
                  Registry& r = registry();
                  std::unique_lock<std::shared_mutex> lk(r.mu);
                  r.live.insert(h.get());
              } catch (...) { return SD_ERR_NO_RAM; }
              *out = h.release();
              return SD_OK;
          }
          } // namespace sd_detail

          SD_API uint32_t sd_api_version(void) { return 0x00030000u; }
          SD_API const char* sd_status_string(sd_status s) { return sd::errString(sd::Err::Ok); }
          SD_API int sd_poly1305_selftest(void) {
              try { return sd::crypto::poly1305SelfTest() ? 1 : 0; } catch (...) { return 0; }
          }
          SD_API void sd_set_random_source(sd_random_fn fn) {
              try { sd::randomSource().store(fn, std::memory_order_release); } catch (...) {}
          }

          #if !defined(SD_WEB)
          SD_API sd_status sd_open_file(const char* dir, const sd_config_c* cfg, const uint8_t* key32, sd_engine** out) {
              if (!out) return SD_ERR_BAD_ARG;
              *out = nullptr;
              if (!cfg || !key32 || !sd_detail::boundedCString(dir, sd::kMaxPathLen)) return SD_ERR_BAD_ARG;
              try {
                  auto store = sd::FileBlockStore::create(dir);
                  if (!store) return SD_ERR_IO;
                  std::unique_ptr<sd::Engine> eng;
                  sd::Err e = sd::Engine::open(sd_detail::toConfig(*cfg), std::move(store), key32, sd::kKey, eng);
                  return sd_detail::finishOpen(e, eng, out);
              } catch (const std::bad_alloc&) { return SD_ERR_NO_RAM; }
              catch (...) { return SD_ERR_IO; }
          }
          #endif

          SD_API sd_status sd_open_memory(const sd_config_c* cfg, const uint8_t* key32, uint64_t quota, sd_engine** out) {
              if (!out) return SD_ERR_BAD_ARG;
              *out = nullptr;
              if (!cfg || !key32) return SD_ERR_BAD_ARG;
              try {
                  std::unique_ptr<sd::Engine> eng;
                  sd::Err e = sd::Engine::open(sd_detail::toConfig(*cfg), std::make_unique<sd::MemoryBlockStore>(quota), key32, sd::kKey, eng);
                  return sd_detail::finishOpen(e, eng, out);
              } catch (const std::bad_alloc&) { return SD_ERR_NO_RAM; }
              catch (...) { return SD_ERR_IO; }
          }

          SD_API void sd_close(sd_engine* e) {
              if (!e) return;
              try {
                  sd_detail::Registry& r = sd_detail::registry();
                  {
                      std::unique_lock<std::shared_mutex> lk(r.mu);
                      if (r.live.erase(e) == 0) return;
                  }
                  delete e;
              } catch (...) {}
          }

          SD_API sd_status sd_destroy(sd_engine* e) {
              return sd_detail::runStatus(e, [](sd::Engine& x) { return x.destroy(); });
          }

          SD_API sd_status sd_write(sd_engine* e, uint64_t offset, const uint8_t* data, uint64_t len) {
              return sd_detail::runStatus(e, [&](sd::Engine& x) { return x.write(offset, data, len); });
          }

          SD_API sd_status sd_read_bounded(sd_engine* e, uint64_t offset, uint8_t* out, size_t out_cap, uint64_t len) {
              if (!out || len > out_cap) return SD_ERR_BAD_ARG;
              return sd_detail::runStatus(e, [&](sd::Engine& x) { return x.read(offset, out, len); });
          }

          SD_API sd_status sd_resize(sd_engine* e, uint64_t capacity) {
              return sd_detail::runStatus(e, [&](sd::Engine& x) { return x.resize(capacity); });
          }

          SD_API uint64_t sd_size(const sd_engine* e) {
              return sd_detail::runValue<uint64_t>(e, 0, [](sd::Engine& x) { return x.size(); });
          }

          SD_API uint64_t sd_capacity(const sd_engine* e) {
              return sd_detail::runValue<uint64_t>(e, 0, [](sd::Engine& x) { return x.capacity(); });
          }

          #if defined(SD_ENABLE_JNI)
          #include <jni.h>
          namespace sd_jni {
          constexpr const char* kClass = "com/zeeshan/audiodiary/NativeVault";

          inline jlong jOpen(JNIEnv* env, jobject, jstring jDir, jbyteArray jKey, jlong capacity) noexcept {
              if (!env) return 0;
              jlong result = 0;
              const char* dir = nullptr;
              try {
                  if (!jDir || !jKey) return 0;
                  if (env->GetArrayLength(jKey) != 32) return 0;
                  dir = env->GetStringUTFChars(jDir, nullptr);
                  if (!dir) return 0;
                  uint8_t key[32] = {0};
                  env->GetByteArrayRegion(jKey, 0, 32, reinterpret_cast<jbyte*>(key));
                  if (!env->ExceptionCheck()) {
                      sd_config_c cfg{};
                      cfg.capacity_bytes = static_cast<uint64_t>(capacity);
                      sd_engine* eng = nullptr;
                      if (sd_open_file(dir, &cfg, key, &eng) == SD_OK) {
                          result = reinterpret_cast<jlong>(eng);
                      }
                  }
                  sd::secureWipe(key, sizeof key);
              } catch (...) { result = 0; }
              if (dir) env->ReleaseStringUTFChars(jDir, dir);
              return result;
          }

          inline jint jWrite(JNIEnv* env, jobject, jlong h, jlong off, jbyteArray data) noexcept {
              if (!env) return SD_ERR_BAD_ARG;
              std::vector<uint8_t> buf;
              jint status = SD_ERR_BAD_ARG;
              try {
                  if (!data || h == 0 || off < 0) return SD_ERR_BAD_ARG;
                  const jsize n = env->GetArrayLength(data);
                  if (n < 0 || static_cast<uint64_t>(n) > sd::kMaxIoPerCall) return SD_ERR_TOO_LARGE;
                  buf.resize(static_cast<size_t>(n));
                  status = SD_OK;
                  if (n > 0) {
                      env->GetByteArrayRegion(data, 0, n, reinterpret_cast<jbyte*>(buf.data()));
                      if (env->ExceptionCheck()) status = SD_ERR_IO;
                  }
                  if (status == SD_OK) {
                      status = sd_write(reinterpret_cast<sd_engine*>(h), static_cast<uint64_t>(off), buf.empty() ? nullptr : buf.data(), static_cast<uint64_t>(n));
                  }
              } catch (...) { status = SD_ERR_IO; }
              sd::secureWipe(buf.data(), buf.size());
              return status;
          }

          inline jbyteArray jRead(JNIEnv* env, jobject, jlong h, jlong off, jlong len) noexcept {
              if (!env) return nullptr;
              std::vector<uint8_t> buf;
              jbyteArray out = nullptr;
              try {
                  if (h == 0 || off < 0 || len <= 0) return nullptr;
                  if (static_cast<uint64_t>(len) > sd::kMaxIoPerCall) return nullptr;
                  buf.assign(static_cast<size_t>(len), 0);
                  if (sd_read_bounded(reinterpret_cast<sd_engine*>(h), static_cast<uint64_t>(off), buf.data(), buf.size(), static_cast<uint64_t>(len)) != SD_OK) {
                      sd::secureWipe(buf.data(), buf.size());
                      return nullptr;
                  }
                  out = env->NewByteArray(static_cast<jsize>(buf.size()));
                  if (out && env->ExceptionCheck()) out = nullptr;
                  if (out) {
                      env->SetByteArrayRegion(out, 0, static_cast<jsize>(buf.size()), reinterpret_cast<const jbyte*>(buf.data()));
                      if (env->ExceptionCheck()) out = nullptr;
                  }
              } catch (...) { out = nullptr; }
              sd::secureWipe(buf.data(), buf.size());
              return out;
          }

          inline void jClose(JNIEnv*, jobject, jlong h) noexcept {
              try { sd_close(reinterpret_cast<sd_engine*>(h)); } catch (...) {}
          }

          inline jint jDestroy(JNIEnv*, jobject, jlong h) noexcept {
              try { return sd_destroy(reinterpret_cast<sd_engine*>(h)); } catch (...) { return SD_ERR_IO; }
          }
          } // namespace sd_jni

          extern "C" JNIEXPORT jint JNICALL JNI_OnLoad(JavaVM* vm, void*) {
              if (!vm) return JNI_ERR;
              JNIEnv* env = nullptr;
              if (vm->GetEnv(reinterpret_cast<void**>(&env), JNI_VERSION_1_6) != JNI_OK || !env) return JNI_ERR;
              jclass cls = env->FindClass(sd_jni::kClass);
              if (!cls) { env->ExceptionClear(); return JNI_ERR; }
              static const JNINativeMethod methods[] = {
                  {const_cast<char*>("nativeOpenFile"), const_cast<char*>("(Ljava/lang/String;[BJ)J"), reinterpret_cast<void*>(&sd_jni::jOpen)},
                  {const_cast<char*>("nativeWrite"), const_cast<char*>("(JJ[B)I"), reinterpret_cast<void*>(&sd_jni::jWrite)},
                  {const_cast<char*>("nativeRead"), const_cast<char*>("(JJJ)[B"), reinterpret_cast<void*>(&sd_jni::jRead)},
                  {const_cast<char*>("nativeDestroy"), const_cast<char*>("(J)I"), reinterpret_cast<void*>(&sd_jni::jDestroy)},
                  {const_cast<char*>("nativeClose"), const_cast<char*>("(J)V"), reinterpret_cast<void*>(&sd_jni::jClose)},
              };
              const jint rc = env->RegisterNatives(cls, methods, static_cast<jint>(sizeof methods / sizeof methods[0]));
              env->DeleteLocalRef(cls);
              if (rc != JNI_OK) { env->ExceptionClear(); return JNI_ERR; }
              return JNI_VERSION_1_6;
          }
          #endif
          EOF

