          import androidx.compose.ui.text.AnnotatedString
          import androidx.compose.ui.text.SpanStyle
          import androidx.compose.ui.text.buildAnnotatedString
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.withStyle
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.lifecycle.AndroidViewModel
          import androidx.lifecycle.viewmodel.compose.viewModel
          import com.google.mlkit.nl.languageid.LanguageIdentification
          import java.util.Locale
          import java.util.UUID

          data class NoteEntry(
              val id: String = UUID.randomUUID().toString(),
              val text: String,
              val timestamp: String
          )

          class ZeeshanViewModel(application: Application) : AndroidViewModel(application) {
              var notes = mutableStateListOf<NoteEntry>()
                  private set

              var activeNoteId by mutableStateOf<String?>(null)
                  private set
              var highlightRange by mutableStateOf<IntRange?>(null)
                  private set

              private var tts: TextToSpeech? = null
              private var isTtsReady = false
              private val languageIdentifier = LanguageIdentification.getClient()

              init {
                  tts = TextToSpeech(application) { status ->
                      if (status == TextToSpeech.SUCCESS) {
                          isTtsReady = true
                          setupTtsListener()
                      }
                  }
              }

              private fun setupTtsListener() {
                  tts?.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                      override fun onStart(utteranceId: String?) {}
                      override fun onRangeStart(utteranceId: String?, start: Int, end: Int, frame: Int) {
                          if (utteranceId == activeNoteId) {
                              highlightRange = start until end
                          }
                      }
                      override fun onDone(utteranceId: String?) {
                          if (utteranceId == activeNoteId) stopPlayback()
                      }
                      @Deprecated("Deprecated in Java")
                      override fun onError(utteranceId: String?) {
                          stopPlayback()
                      }
                  })
              }

              fun addNote(rawText: String) {
                  val cleaned = rawText.trim()
                  if (cleaned.isNotEmpty()) {
                      val time = java.text.SimpleDateFormat("hh:mm a", Locale.getDefault()).format(java.util.Date())
                      notes.add(NoteEntry(text = cleaned, timestamp = time))
                  }
              }

              fun toggleSpeak(note: NoteEntry) {
                  if (!isTtsReady) return
                  if (activeNoteId == note.id) {
                      stopPlayback()
                      return
                  }
                  stopPlayback()
                  activeNoteId = note.id
                  highlightRange = null

                  languageIdentifier.identifyLanguage(note.text)
                      .addOnSuccessListener { languageCode ->
                          val locale = if (languageCode != "und") Locale.forLanguageTag(languageCode) else Locale.getDefault()
                          val result = tts?.setLanguage(locale)
                          if (result == TextToSpeech.LANG_MISSING_DATA || result == TextToSpeech.LANG_NOT_SUPPORTED) {
                              tts?.language = Locale.getDefault()
                          }
                          speakText(note)
                      }
                      .addOnFailureListener {
                          tts?.language = Locale.getDefault()
                          speakText(note)
                      }
              }

              private fun speakText(note: NoteEntry) {
                  val params = Bundle()
                  tts?.speak(note.text, TextToSpeech.QUEUE_FLUSH, params, note.id)
              }

              fun stopPlayback() {
                  tts?.stop()
                  activeNoteId = null
                  highlightRange = null
              }

              fun clearAllData() {
                  stopPlayback()
                  notes.clear()
              }

              override fun onCleared() {
                  clearAllData()
                  tts?.shutdown()
                  languageIdentifier.close()
                  super.onCleared()
              }
          }

          class MainActivity : ComponentActivity() {
              private var appViewModel: ZeeshanViewModel? = null

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      val vm: ZeeshanViewModel = viewModel()
                      appViewModel = vm
                      ZeeshanAppScreen(viewModel = vm)
                  }
              }

              override fun onDestroy() {
                  appViewModel?.clearAllData()
                  super.onDestroy()
              }
          }

          @OptIn(ExperimentalMaterial3Api::class)
