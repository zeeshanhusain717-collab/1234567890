                              )
                          },
                          colors = TopAppBarDefaults.topAppBarColors(containerColor = Color(0xFF0D47A1))
                      )
                  },
                  bottomBar = {
                      Surface(shadowElevation = 8.dp, color = Color.White) {
                          Row(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .padding(horizontal = 12.dp, vertical = 8.dp)
                                  .imePadding(),
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              OutlinedTextField(
                                  value = inputText,
                                  onValueChange = { inputText = it },
                                  modifier = Modifier.weight(1f),
                                  placeholder = { Text("पेस्ट करें...") },
                                  maxLines = 4,
                                  shape = RoundedCornerShape(24.dp)
                              )
                              Spacer(modifier = Modifier.width(8.dp))
                              FilledIconButton(
                                  onClick = {
                                      if (inputText.isNotBlank()) {
                                          viewModel.addNote(inputText)
                                          inputText = ""
                                      }
                                  },
                                  modifier = Modifier.size(48.dp),
                                  colors = IconButtonDefaults.filledIconButtonColors(containerColor = Color(0xFF0D47A1))
                              ) {
                                  Icon(imageVector = Icons.AutoMirrored.Filled.Send, contentDescription = "Send", tint = Color.White)
                              }
                          }
                      }
                  }
              ) { paddingValues ->
                  LazyColumn(
                      state = listState,
                      modifier = Modifier
                          .fillMaxSize()
                          .background(Color(0xFFF5F7FA))
                          .padding(paddingValues)
                          .padding(horizontal = 12.dp, vertical = 8.dp),
                      verticalArrangement = Arrangement.spacedBy(12.dp)
                  ) {
                      items(viewModel.notes, key = { it.id }) { note ->
                          val isPlaying = viewModel.activeNoteId == note.id
                          val currentRange = if (isPlaying) viewModel.highlightRange else null

                          NoteCardItem(
                              note = note,
                              isPlaying = isPlaying,
                              highlightRange = currentRange,
                              onCopyClick = { clipboardManager.setText(AnnotatedString(note.text)) },
                              onSpeakClick = { viewModel.toggleSpeak(note) }
                          )
                      }
                  }
              }
          }

          @Composable
          fun NoteCardItem(
              note: NoteEntry,
              isPlaying: Boolean,
              highlightRange: IntRange?,
              onCopyClick: () -> Unit,
              onSpeakClick: () -> Unit
          ) {
              Card(
                  modifier = Modifier.fillMaxWidth(),
                  shape = RoundedCornerShape(12.dp),
                  colors = CardDefaults.cardColors(containerColor = Color.White),
                  elevation = CardDefaults.cardElevation(defaultElevation = 2.dp)
              ) {
                  Column(modifier = Modifier.fillMaxWidth()) {
                      Row(
                          modifier = Modifier
                              .fillMaxWidth()
                              .background(Color(0xFFE3F2FD))
                              .padding(horizontal = 12.dp, vertical = 6.dp),
                          verticalAlignment = Alignment.CenterVertically,
                          horizontalArrangement = Arrangement.SpaceBetween
                      ) {
                          Text(
                              text = "Entry • ${note.timestamp}",
                              fontSize = 12.sp,
                              fontWeight = FontWeight.Medium,
                              color = Color(0xFF0D47A1)
                          )
                          Row(verticalAlignment = Alignment.CenterVertically) {
                              TextButton(
                                  onClick = onCopyClick,
                                  contentPadding = PaddingValues(horizontal = 8.dp, vertical = 0.dp),
                                  modifier = Modifier.height(32.dp)
                              ) {
                                  Icon(imageVector = Icons.Default.ContentCopy, contentDescription = "Copy", modifier = Modifier.size(16.dp), tint = Color(0xFF0D47A1))
                                  Spacer(modifier = Modifier.width(4.dp))
                                  Text("Copy", fontSize = 12.sp, color = Color(0xFF0D47A1))
                              }
                              Spacer(modifier = Modifier.width(4.dp))
                              IconButton(
                                  onClick = onSpeakClick,
                                  modifier = Modifier.size(32.dp)
                              ) {
                                  Icon(
                                      imageVector = if (isPlaying) Icons.Default.Stop else Icons.Default.Mic,
                                      contentDescription = if (isPlaying) "Stop" else "Speak",
                                      tint = if (isPlaying) Color(0xFFD32F2F) else Color(0xFF0D47A1),
                                      modifier = Modifier.size(20.dp)
                                  )
                              }
                          }
                      }

                      Box(modifier = Modifier.padding(14.dp)) {
                          val annotatedText = remember(note.text, highlightRange) {
                              buildAnnotatedString {
                                  if (highlightRange != null && highlightRange.first >= 0 && highlightRange.last < note.text.length) {
                                      append(note.text.substring(0, highlightRange.first))
                                      withStyle(style = SpanStyle(background = Color(0xFF00B0FF).copy(alpha = 0.28f), color = Color.Black)) {
                                          append(note.text.substring(highlightRange.first, highlightRange.last + 1))
                                      }
                                      append(note.text.substring(highlightRange.last + 1))
                                  } else {
                                      append(note.text)
                                  }
                              }
                          }

                          SelectionContainer {
                              Text(
                                  text = annotatedText,
                                  fontSize = 16.sp,
                                  lineHeight = 24.sp,
                                  color = Color.Black
                              )
                          }
                      }
                  }
              }
          }
          EOF

      - name: 17. Compile and Build Debug APK with Native Libraries
        run: |
          echo "⚙️ Starting Gradle Build with C++ Native Secure Storage Engine..."
          gradle assembleDebug

      - name: 18. Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zeeshan-Audio-Diary-Secure-APK
          path: app/build/outputs/apk/debug/app-debug.apk
